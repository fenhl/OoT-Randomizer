[package]
name = "ootr-python"
version.workspace = true
edition.workspace = true

[lints.rust]
rust_2018_idioms = "deny"
#unsafe_code = "forbid" # PyO3 generates unsafe code
unused = "deny"
unused_crate_dependencies = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"
warnings = "deny"

[lib]
name = "rs"
crate-type = ["cdylib"]

[build-dependencies]
pyo3-build-config = "0.25"

[dependencies]
anyhow = "1"
arrayref = "0.3"
collect-mac = "0.1"
decompress = { git = "https://github.com/fenhl/OoT_Decompressor" }
indexmap = "2"
itertools = "0.14"
lazy-regex = "3"
pyo3 = { version = "0.25", features = ["anyhow", "auto-initialize", "extension-module", "indexmap"] }
semver = "1"
wheel = { git = "https://github.com/fenhl/wheel", features = ["pyo3"] }
