[package]
name = "ootr-build"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
clap = { version = "4.5.41", features = ["derive"] }
decompress = { git = "https://github.com/fenhl/OoT_Decompressor" }
directories = "6.0.0"
futures = "0.3.31"
itermore = { version = "0.7.1", features = ["array_chunks"] }
lazy-regex = "3.4.1"
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "2.0.12"
tokio = { version = "1.44.1", features = ["io-util", "process"] }
tokio-stream = { version = "0.1.17", features = ["io-util"] }
wheel = { git = "https://github.com/fenhl/wheel", features = ["serde_json"] }
