[workspace]
members = ["crate/*"]
default-members = ["crate/ootr-cli"]
resolver = "2"

[workspace.package]
version = "8.3.41-fenhl.2.riir.1"
edition = "2024"

[workspace.lints.rust]
rust_2018_idioms = "deny"
unsafe_code = "forbid"
unused = "deny"
unused_crate_dependencies = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"
warnings = "deny"

[profile.release]
codegen-units = 1
lto = true
strip = true

[profile.flamegraph]
inherits = "release"
debug = true

[profile.gui-debug]
inherits = "dev"
opt-level = 2
